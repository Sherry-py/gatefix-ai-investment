# evidence/ai_investment_evidence.yaml —— "GateFix 方法（Xirui Lian Sherry 开发）· 中美绿色基金采用"的证据快照
#
# 示例样本：某 AI 项目（已脱敏，不代表任何具体标的的尽调结论）。证据取值是
# 构造的代表性数据，不是真实内部尽调材料——文件头据此如实标注。
#
# 设计意图：这份证据刻意保留"治理证据大量待确认 + 落地证据口径不清"的典型状态，
# 用来验证 gate 会不会正确把投资决策路由到 ESCALATE（人工终审），而不是默认 PASS。
# 治理缺口（备案/数据合规）标注 governance_gap_externally_verifiable=true，
# 意味着会先走一轮 AUTO_REPAIR 尝试补证；补证后其余缺口（安全/可控/隐私/跨境）
# 仍无法自动闭合，最终收敛到 ESCALATE。
# 换成基金已投/在看的真实项目时，把它的尽调材料按同样字段填进来即可。

invest_decision:
  filing_license_verified: false            # 备案号未提供（待确认）
  data_compliance_verified: false           # 训练数据来源合规待确认
  safety_certified: false                   # 安全认证待确认
  controllability_data_present: false       # 远程介入率/故障率等可控性数据未提供
  privacy_compliance_verified: false        # 数据采集隐私合规待确认
  cross_border_compliance_verified: false   # 有海外股东/跨境要素，跨境合规待确认
  compliance_before_operations: false       # 未确认"先合规后运营"顺序
  evidence_source_verified: false           # 自报，第三方未复现
  governance_gap_externally_verifiable: true  # 备案/数据授权可外部核查 → 走 AUTO_REPAIR

valuation:
  production_deployed: true                 # 某场景 POC 通过、已有落地部署
  paying_contracts_verified: false          # 签约 N 套，但合同/框架/意向三口径未分清
  industry_embedded: true                   # 嵌入真实产业环节
  economic_value_quantified: false          # ROI 模型待复购验证
  repeat_orders: false                      # 复购未验证
  delivery_before_repeat_claim: false       # 交付量 vs 签约量口径未对齐
  contract_evidence_verified_third_party: false  # 自报
  landing_gap_externally_verifiable: true   # 合同可要求盖章原件核实 → 走 AUTO_REPAIR

team_capability:
  # bypass_to_human，不进入 4D-CQ 计算，无证据字段
  note: "团队驾驭能力（能不能落地）需投委会人工判断，机器不替这一步做主"
